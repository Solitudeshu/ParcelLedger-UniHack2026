[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kien-chung"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "boto3>=1.35,<2",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "rfc8785>=0.1.4,<1",
  "python-multipart>=0.0.18,<1",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "eth-account>=0.13,<1",
  "reportlab==5.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
ml = ["torch>=2.5,<3", "torchvision>=0.20,<1", "scikit-learn>=1.6,<2", "safetensors>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["services*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

